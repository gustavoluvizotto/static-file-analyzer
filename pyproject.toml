[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "File-scanning stage of a malware analysis pipeline (toy)"
requires-python = ">=3.11"
dependencies = ["yara-python>=4.3", "tldextract>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
